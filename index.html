<!doctype html>
<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/activities-lab/favicon.svg" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to work on iOS.
         maximum-scale + user-scalable disable native pinch / double-tap zoom;
         the user controls scale via Settings → Zoom %. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Browser UI / Android theme color — kept equal to manifest.theme_color -->
    <meta name="theme-color" content="#ECE5D8" />

    <!-- iOS standalone. Safari ignores the manifest for these, so they live here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Activities Lab" />

    <!-- iOS home-screen icon (Safari ignores manifest icons). 180x180 PNG, no transparency. -->
    <link rel="apple-touch-icon" href="/activities-lab/apple-touch-icon.png" />

    <meta
      name="description"
      content="Activities Lab — a local-first personal training, nutrition, recovery and self-development app."
    />
